<!doctype html>
<html>
  <head>
    <title>Analyst Alien</title>
    {% include 'header.html' %}
    <script src="{{ url_for('static', filename='js/analyst.js') }}"></script>
  </head>
  <body>
    <div id="paper">
      <center>
        <h1>Analyst</h1>
      </center>

      <div id="notSupported" style="display: none">
        Sorry, Firefox is not supported. Please use Chrome, Edge, Opera, Safari
        or Samsung browser.
      </div>

      <div class="video-container">
        <video class="video" id="agent" preload="true">
          <source
            src="{{ url_for('static', filename='media/jura-anim.mp4') }}"
            type="video/mp4"
          />
        </video>
      </div>

      <center><div id="output"></div></center>
      <br />
      <center>
        <button class="button" id="record" style="display: none">
          Snimi pitanje!
        </button>
        <br />
        <select id="questions" onchange="question(this.value)">
          <option value="">
            Izgovori pitanje ili ga odaberi iz padajuće liste
          </option>
          <option>Tko si ti?</option>
          <option>Tko te napravio?</option>
          <option>Kako si?</option>
          <option>Je li ti lijepo s nama?</option>
          <option>Bravo!</option>
        </select>
      </center>
      <div id="startupute">
        <center>
          <button class="button" id="start">Pokreni!</button>
          <br />
          <br />
          <br />
        </center>
      </div>
      <br />
      {% include 'footer.html' %}
    </div>
  </body>
</html>
