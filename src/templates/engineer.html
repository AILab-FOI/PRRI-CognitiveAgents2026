<!doctype html>
<html>
  <head>
    <title>Engineer Alien</title>
    {% include 'header.html' %}
    <script src="{{ url_for('static', filename='js/engineer.js') }}"></script>
  </head>
  <body>
    <div id="paper">
      <center>
        <h1>Engineer</h1>
      </center>

      <div id="notSupported" style="display: none">
        Sorry, Firefox is not supported. Please use Chrome, Edge, Opera, Safari
        or Samsung browser.
      </div>

      <div class="video-container">
        <video class="video" id="agent" preload="true">
          <source
            src="{{ url_for('static', filename='media/jura-anim.mp4') }}"
            type="video/mp4"
          />
        </video>
      </div>

      <center><div id="output"></div></center>
      <br />
      <center>
        <button class="button" id="record" style="display: none">
          Snimi pitanje!
        </button>
        <br />
        <select id="questions" onchange="question(this.value)">
          <option value="">
            Izgovori pitanje ili ga odaberi iz padajuće liste
          </option>
          <option>Kako se zovu riječi koje zamjenjuju druge riječi?</option>
          <option>Koje su osobne zamjenice?</option>
          <option>
            Kako se zovu zamjenice kojima zamjenjujemo govorne osobe?
          </option>
          <option>Koje su zamjenice negovorne osobe?</option>
          <option>Kako se zove promjena oblika osobnih zamjenica?</option>
          <option>Kada zamjenicu vi pišemo velikim početnim slovom?</option>
          <option>Koje su posvojne zamjenice?</option>
          <option>Što zamjenjuju posvojne zamjenice?</option>
          <option>Na koje pitanje odgovaraju posvojne zamjenice?</option>
          <option>Što izriču posvojne zamjenice?</option>
          <option>
            U čemu se posvojne zamjenice slažu s imenicu uz koju stoje?
          </option>
          <option>
            Kako pišemo posvojne zamjenice vaš, vaša, vaše pri obraćanju dvjema
            osobama ili skupini ljudi?
          </option>
          <option>Kojoj skupini riječi pripadaju zamjenice?</option>
          <option>Što izriče povratna zamjenica sebe?</option>
          <option>
            Koji se oblici zamjenica mogu naći na početku rečenice?
          </option>
          <option>
            Ima li povratna zamjenica sebe oblike u nominativu i vokativu?
          </option>
          <option>Što izriče povratno-posvojna zamjenica svoj?</option>
          <option>
            Koje zamjenice zamjenjuje povratno-posvojna zamjenica svoj?
          </option>
          <option>Kojim oblicima zamjenica dajemo prednost?</option>
          <option>Koje su riječi pokazne zamjenice?</option>
          <option>Na koja pitanja odgovaraju pokazne zamjenice?</option>
          <option>Tko si ti?</option>
          <option>Tko te napravio?</option>
          <option>Kako si?</option>
          <option>Je li ti lijepo s nama?</option>
          <option>Bravo!</option>
        </select>
      </center>
      <div id="startupute">
        <center>
          <button class="button" id="start">Pokreni!</button>
          <br />
          <br />
          <br />
        </center>
      </div>
      <br />
      {% include 'footer.html' %}
    </div>
  </body>
</html>
